name: Build & Release APK

# Se ejecuta en cada push a master/main Y cuando creas un tag vX.X.X
on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
  # También permite lanzarlo manualmente desde GitHub Actions
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar JDK 17 (requerido por el proyecto)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Dar permisos al wrapper de Gradle
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 4. Cache de dependencias Gradle para builds más rápidos
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Compilar el APK de release (sin firmar — debug es suficiente para distribución personal)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Renombrar el APK con versión y fecha
      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+')
          DATE=$(date +%Y%m%d)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/EricCatch-v${VERSION}-${DATE}.apk
          echo "APK_NAME=EricCatch-v${VERSION}-${DATE}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # 7. Subir APK como artifact del workflow (siempre disponible)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: artifacts/*.apk
          retention-days: 30

      # 8. Crear GitHub Release con el APK adjunto
      #    Solo se ejecuta cuando hay un tag vX.X.X
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "EricCatch v${{ env.VERSION }}"
          body: |
            ## 📲 EricCatch v${{ env.VERSION }}

            ### Instalación
            1. Descarga el archivo `.apk` de abajo
            2. En tu Android: **Ajustes → Seguridad → Fuentes desconocidas** (activar)
            3. Abre el APK descargado e instala

            ### Cambios
            ${{ github.event.head_commit.message }}

            ---
            *Build automático — rama `${{ github.ref_name }}`*
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job separado: también construye APK firmado si tienes el keystore configurado
  # (Opcional — descomenta cuando tengas el keystore)
